services:
  - type: web
    name: notetaking
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notetaking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false   # You fill this in the Render dashboard (optional)
      - key: NODE_ENV
        value: production

databases:
  - name: notetaking-db
    plan: free
